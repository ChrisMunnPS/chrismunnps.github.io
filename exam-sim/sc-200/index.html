<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-200 Exam Simulator</title>
<meta name="description" content="Full-length SC-200 practice exam covering Defender XDR, Microsoft Sentinel, KQL detection engineering, and incident response, with architecture diagrams, a timer, scoring, and per-question review.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b91c1c'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial,sans-serif' font-size='21' font-weight='700' fill='white' text-anchor='middle'%3ESC%3C/text%3E%3C/svg%3E">
<script>
/* Pick the theme before first paint: saved choice, else the OS setting. */
(function () {
  var theme = '';
  try { theme = localStorage.getItem('sc200-sim:theme') || ''; } catch (e) {}
  if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="stylesheet" href="styles.css">
<style>
  /* SC-200 domain colours, keyed to exam.config.js. Kept here so the shared
     engine stylesheet stays generic and the packaging script can replace it. */
  .badge.xdr { background: #fee2e2; color: #991b1b; }
  .badge.sentinel { background: #e0f2fe; color: #075985; }
  .badge.kql { background: #ccfbf1; color: #115e59; }
  .badge.response { background: #ede9fe; color: #5b21b6; }
  .swatch.xdr { background: #b91c1c; }
  .swatch.sentinel { background: #0369a1; }
  .swatch.kql { background: #0f766e; }
  .swatch.response { background: #7c3aed; }
  :where(html[data-theme="dark"]) .badge.xdr { background: #450a0a; color: #fecaca; }
  :where(html[data-theme="dark"]) .badge.sentinel { background: #082f49; color: #bae6fd; }
  :where(html[data-theme="dark"]) .badge.kql { background: #042f2e; color: #99f6e4; }
  :where(html[data-theme="dark"]) .badge.response { background: #2e1065; color: #ddd6fe; }
</style>
</head>

</div>

</html>
