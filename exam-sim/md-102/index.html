<meta name="description" content="Full-length MD-102 practice exam covering Windows client deployment, Entra ID device identity, compliance, Intune device management, endpoint protection, Windows updates, and app deployment, with architecture diagrams, a timer, scoring, and per-question review.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e7490'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial,sans-serif' font-size='21' font-weight='700' fill='white' text-anchor='middle'%3EMD%3C/text%3E%3C/svg%3E">
<script>
/* Pick the theme before first paint: saved choice, else the OS setting. */
(function () {
  var theme = '';
  try { theme = localStorage.getItem('md102-sim:theme') || ''; } catch (e) {}
  if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="stylesheet" href="styles.css">
<style>
  /* MD-102 domain colours, keyed to exam.config.js. Kept here so the shared
     engine stylesheet stays generic and the packaging script can replace it. */
  .badge.deploy { background: #cffafe; color: #155e75; }
  .badge.identity { background: #ede9fe; color: #5b21b6; }
  .badge.manage { background: #fef3c7; color: #92400e; }
  .badge.apps { background: #d1fae5; color: #065f46; }
  .swatch.deploy { background: #0e7490; }
  .swatch.identity { background: #6d28d9; }
  .swatch.manage { background: #b45309; }
  .swatch.apps { background: #047857; }
  :where(html[data-theme="dark"]) .badge.deploy { background: #083344; color: #a5f3fc; }
  :where(html[data-theme="dark"]) .badge.identity { background: #2e1065; color: #ddd6fe; }
  :where(html[data-theme="dark"]) .badge.manage { background: #451a03; color: #fde68a; }
  :where(html[data-theme="dark"]) .badge.apps { background: #022c22; color: #a7f3d0; }
</style>
</head>
